version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mabiguild
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mabiguild?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/mabiguild?schema=public
      ROOT_DOMAIN: platform.localhost
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - db

volumes:
  pgdata:
