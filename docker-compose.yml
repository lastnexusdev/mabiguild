version: "3.9"

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mabiguild
      MYSQL_ROOT_PASSWORD: 2342sk
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    environment:
      DATABASE_URL: mysql://root:2342sk@db:3306/mabiguild
      ROOT_DOMAIN: platform.localhost
      NEXTAUTH_URL: http://platform.localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - db

volumes:
  mysqldata:
