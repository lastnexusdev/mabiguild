version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mabiguild
      MYSQL_USER: mabiguild
      MYSQL_PASSWORD: mabiguild_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://mabiguild:mabiguild_pass@db:3306/mabiguild"
      NEXT_PUBLIC_ROOT_DOMAIN: "localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SESSION_SECRET: "change-this-to-a-long-random-secret-value"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
